[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lazypye-data-structures"
version = "0.1.0"
description = "Data structure utilities from LazyPye"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lazypye.data_structures*"]
namespaces = true